name: 飞书表格每日数据自动补齐

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      config_file:
        description: 'JSON配置文件路径（可选，默认运行所有项目）'
        required: false
        default: ''

jobs:
  fill-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run auto fill - 普朗克
        if: github.event.inputs.config_file == '' || github.event.inputs.config_file == 'config.json'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 auto_fill.py --config config.json

      - name: Run auto fill - 泰勒士
        if: github.event.inputs.config_file == '' || github.event.inputs.config_file == 'config_taylor.json'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 auto_fill.py --config config_taylor.json

      - name: Run auto fill - 桑格
        if: github.event.inputs.config_file == '' || github.event.inputs.config_file == 'config_sanger.json'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 auto_fill.py --config config_sanger.json

      - name: Run auto fill - 阿基米德
        if: github.event.inputs.config_file == '' || github.event.inputs.config_file == 'config_archimedes.json'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 auto_fill.py --config config_archimedes.json

      - name: Run auto fill - 摩根
        if: github.event.inputs.config_file == '' || github.event.inputs.config_file == 'config_morgan.json'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 auto_fill.py --config config_morgan.json
